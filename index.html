// ============================================================
// CUSTOMER QR SCANNER
// ============================================================
function CustomerScan() {
  const { setView, shop, notify } = useContext(AppCtx);
  const [scanning, setScanning] = useState(false);

  const simulateScan = () => {
    setScanning(true);
    setTimeout(() => {
      setScanning(false);
      notify('Shop Found! 🏪', `Connected to ${shop.name}`, '✅');
      setView('customerShop');
    }, 2200);
  };

  return (
    <div className="scanner-page fade-in">
      <div style={{textAlign:'center',marginBottom:8}}>
        <div style={{fontSize:32,fontWeight:900,letterSpacing:-1}}>Stock<span style={{color:'var(--accent)'}}>ify</span></div>
        <div style={{color:'var(--text-secondary)',marginTop:6}}>Scan a shop's QR to start shopping</div>
      </div>

      <div className="scanner-frame">
        <div className="scanner-corner tl"></div>
        <div className="scanner-corner tr"></div>
        <div className="scanner-corner bl"></div>
        <div className="scanner-corner br"></div>
        {scanning && <div className="scanner-line"></div>}
        <div className="scanner-inner">
          {scanning ? (
            <>
              <div className="spinner"></div>
              <span style={{fontSize:12}}>Scanning...</span>
            </>
          ) : (
            <>
              <span style={{fontSize:48,opacity:0.3}}>📷</span>
              <span>Camera preview</span>
            </>
          )}
        </div>
      </div>

      <button className="btn btn-primary btn-lg" onClick={simulateScan} disabled={scanning}>
        {scanning ? '🔍 Scanning...' : '📷 Scan QR Code'}
      </button>

      <div style={{marginTop:20,textAlign:'center'}}>
        <div style={{fontSize:13,color:'var(--text-muted)',marginBottom:10}}>— or enter shop code manually —</div>
        <button className="btn btn-outline" onClick={() => setView('customerShop')}>
          🏪 Browse Demo Shop
        </button>
      </div>

      <button className="btn btn-ghost" style={{marginTop:16,color:'var(--text-muted)'}} onClick={() => setView('landing')}>
        ← Back
      </button>
    </div>
  );
}

// ============================================================
// CUSTOMER SHOP PAGE
// ============================================================
function CustomerShop() {
  const { products, shop, addToCart, cart, cartOpen, setCartOpen, cartCount, cartTotal, updateCartQty, removeFromCart, placeOrder, setView } = useContext(AppCtx);
  const [search, setSearch] = useState('');
  const [category, setCategory] = useState('All');

  const categories = ['All', ...new Set(products.map(p => p.category))];
  const filtered = products.filter(p => {
    const matchCat = category === 'All' || p.category === category;
    const matchSearch = !search || p.name.toLowerCase().includes(search.toLowerCase());
    return matchCat && matchSearch;
  });

  const getCartQty = (id) => cart.find(c => c.id === id)?.qty || 0;

  return (
    <div style={{minHeight:'100vh',background:'var(--bg-primary)',paddingBottom:100}}>
      {/* Header */}
      <div className="shop-header">
        <div className="shop-header-inner">
          <div style={{minWidth:0}}>
            <div style={{fontSize:'1.0625rem',fontWeight:800,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{shop.name}</div>
            <div style={{fontSize:'.75rem',color:'var(--text-secondary)'}}>📍 Kirana Shop</div>
          </div>
          <div className="shop-header-right">
            <div className="search-bar" style={{maxWidth:220}}>
              <span className="search-icon">🔍</span>
              <input className="search-input" placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} />
            </div>
            <div style={{position:'relative'}}>
              <button className="cart-fab-btn" onClick={() => setCartOpen(true)} aria-label="Open cart">
                🛒
                {cartCount > 0 && <span className="cart-count-badge">{cartCount}</span>}
              </button>
            </div>
          </div>
        </div>
      </div>

      <div style={{maxWidth:1200,margin:'0 auto',padding:'1.25rem 1rem'}}>
        {/* Category filter */}
        <div className="cat-filters">
          {categories.map(c => (
            <button key={c} className={`cat-btn ${category===c?'active':''}`} onClick={() => setCategory(c)}>{c}</button>
          ))}
        </div>

        {/* Products */}
        <div className="products-grid">
          {filtered.map(p => {
            const qty = getCartQty(p.id);
            const stockPct = Math.min(100, (p.stock/60)*100);
            return (
              <div key={p.id} className="product-card fade-in">
                <div className="product-header">
                  <div>
                    <div className="product-name">{p.name}</div>
                    <div className="product-category">{p.category}</div>
                  </div>
                  <span className={`badge ${p.stock===0?'badge-danger':p.stock<=10?'badge-warning':'badge-success'}`} style={{flexShrink:0}}>
                    {p.stock===0?'Out':p.stock<=10?'Low':'In Stock'}
                  </span>
                </div>

                <div>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--text-muted)',marginBottom:5}}>
                    <span>Stock</span><span>{p.stock} {p.unit}</span>
                  </div>
                  <div className="product-stock-bar">
                    <div className="product-stock-fill" style={{width:`${stockPct}%`, background: p.stock===0?'var(--danger)':p.stock<=10?'var(--warning)':'var(--success)'}}></div>
                  </div>
                </div>

                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <div className="product-price">₹{p.price}<small>/{p.unit}</small></div>
                  {p.stock === 0 ? (
                    <span style={{fontSize:13,color:'var(--text-muted)'}}>Unavailable</span>
                  ) : qty === 0 ? (
                    <button className="btn btn-primary btn-sm" onClick={() => addToCart(p)}>+ Add</button>
                  ) : (
                    <div className="qty-control">
                      <button className="qty-btn" onClick={() => updateCartQty(p.id, qty-1)}>−</button>
                      <span className="qty-value">{qty}</span>
                      <button className="qty-btn" onClick={() => updateCartQty(p.id, qty+1)}>+</button>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Cart Panel */}
      <div className={`cart-panel ${cartOpen?'open':''}`}>
        <div className="cart-header">
          <div className="cart-title">🛒 Your Cart</div>
          <button className="modal-close" onClick={() => setCartOpen(false)}>✕</button>
        </div>
        <div className="cart-body">
          {cart.length === 0 ? (
            <div className="empty-state"><div className="empty-state-icon">🛒</div><div className="empty-state-title">Cart is empty</div><div className="empty-state-sub">Add products to get started</div></div>
          ) : cart.map(item => (
            <div key={item.id} className="cart-item">
              <div className="cart-item-name">{item.name}</div>
              <div className="cart-item-row">
                <div className="qty-control">
                  <button className="qty-btn" onClick={() => updateCartQty(item.id, item.qty-1)}>−</button>
                  <span className="qty-value">{item.qty}</span>
                  <button className="qty-btn" onClick={() => updateCartQty(item.id, item.qty+1)}>+</button>
                </div>
                <div className="cart-item-price">₹{item.price*item.qty}</div>
              </div>
            </div>
          ))}
        </div>
        {cart.length > 0 && (
          <div className="cart-footer">
            <div className="cart-total-row">
              <div className="cart-total-label">Total Amount</div>
              <div className="cart-total-value">₹{cartTotal}</div>
            </div>
            <div style={{background:'rgba(67,217,173,0.1)',border:'1px solid rgba(67,217,173,0.2)',borderRadius:10,padding:'10px 14px',marginBottom:16,fontSize:13,color:'var(--success)'}}>
              30% advance: ₹{Math.round(cartTotal*0.3)}
            </div>
            <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={placeOrder}>
              Place Order 🎉
            </button>
          </div>
        )}
      </div>

      {/* Cart backdrop */}
      {cartOpen && <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:199}} onClick={() => setCartOpen(false)}></div>}
    </div>
  );
}

// ORDER SUCCESS PAGE
// ============================================================
function OrderSuccessPage() {
  const { lastOrder, setView, shop } = useContext(AppCtx);

  return (
    <div className="auth-page">
      <div className="auth-card" style={{maxWidth:480,textAlign:'center'}}>
        <div className="order-success">
          <div className="order-success-icon">🎉</div>
          <div className="order-success-title">Order Placed!</div>
          <div className="order-success-sub">
            Your order #{lastOrder?.id} has been placed at <strong>{shop?.name}</strong>. The owner has been notified and will prepare it shortly.
          </div>
          {lastOrder && (
            <div style={{background:'var(--bg-input)',borderRadius:14,padding:20,marginBottom:24,textAlign:'left'}}>
              {lastOrder.items.map((it,i) => (
                <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border)',fontSize:14}}>
                  <span>{it.name} ×{it.qty}</span><span>₹{it.price*it.qty}</span>
                </div>
              ))}
              <div style={{display:'flex',justifyContent:'space-between',padding:'12px 0 4px',fontWeight:800}}>
                <span>Total</span><span style={{color:'var(--accent)'}}>₹{lastOrder.total}</span>
              </div>
              <div style={{fontSize:13,color:'var(--success)',textAlign:'center',marginTop:8}}>
                30% advance: ₹{Math.round(lastOrder.total*0.3)} — pay at pickup
              </div>
            </div>
          )}
          <div style={{background:'rgba(108,99,255,0.1)',border:'1px solid rgba(108,99,255,0.3)',borderRadius:12,padding:'14px',marginBottom:24,fontSize:14,color:'var(--accent)'}}>
            📲 You'll be notified when your order is ready for pickup!
          </div>
          <button className="btn btn-primary btn-lg" style={{width:'100%',justifyContent:'center'}} onClick={() => setView('customerShop')}>
            Continue Shopping
          </button>
          <button className="btn btn-ghost" style={{width:'100%',justifyContent:'center',marginTop:10}} onClick={() => setView('landing')}>
            Back to Home
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// FIREBASE SETUP NOTICE
// ============================================================
function FirebaseNotice({ onDismiss }) {
  return (
    <div className="modal-overlay">
      <div className="modal modal-lg">
        <div className="modal-header">
          <div className="modal-title">🔥 Firebase Setup Required</div>
          <button className="modal-close" onClick={onDismiss}>✕</button>
        </div>
        <p style={{color:'var(--text-secondary)',fontSize:14,lineHeight:1.7,marginBottom:20}}>
          Stockify is built to use <strong style={{color:'var(--text-primary)'}}>Firebase</strong> for real-time sync, authentication, and data storage. To enable the full backend, replace the config at the top of the file with your Firebase project credentials.
        </p>
        <div style={{background:'var(--bg-input)',borderRadius:12,padding:20,fontFamily:'monospace',fontSize:13,color:'var(--accent3)',marginBottom:20,lineHeight:1.8}}>
          {`const FIREBASE_CONFIG = {`}<br/>
          {`  apiKey: "YOUR_API_KEY",`}<br/>
          {`  authDomain: "YOUR_PROJECT.firebaseapp.com",`}<br/>
          {`  projectId: "YOUR_PROJECT_ID",`}<br/>
          {`  ...`}<br/>
          {`};`}
        </div>
        <div style={{marginBottom:20}}>
          <div style={{fontWeight:700,marginBottom:12}}>Steps to set up Firebase:</div>
          {[
            'Go to console.firebase.google.com and create a project',
            'Enable Authentication → Email/Password + Google',
            'Create a Firestore database in production mode',
            'Go to Project Settings → Web App → copy the config',
            'Replace FIREBASE_CONFIG in this file with your config',
          ].map((s,i) => (
            <div key={i} style={{display:'flex',gap:12,padding:'8px 0',borderBottom:'1px solid var(--border)',fontSize:14}}>
              <span style={{color:'var(--accent)',fontWeight:700,minWidth:20}}>{i+1}.</span>
              <span>{s}</span>
            </div>
          ))}
        </div>
        <button className="btn btn-primary" style={{width:'100%',justifyContent:'center'}} onClick={onDismiss}>
          Continue with Demo Mode →
        </button>
      </div>
    </div>
  );
}

// ============================================================
// APP ROOT
// ============================================================
function App() {
  const { view, userRole } = useContext(AppCtx);
  const [showFirebaseNotice, setShowFirebaseNotice] = useState(true);

  return (
    <>
      <NotifToasts />
      {showFirebaseNotice && <FirebaseNotice onDismiss={() => setShowFirebaseNotice(false)} />}
      {view === 'landing' && <LandingPage />}
      {view === 'ownerAuth' && <AuthPage role="owner" />}
      {view === 'customerAuth' && <AuthPage role="customer" />}
      {view === 'ownerSetup' && <OwnerSetupPage />}
      {view === 'ownerDash' && <OwnerDashboard />}
      {view === 'customerScan' && <CustomerScan />}
      {view === 'customerShop' && <CustomerShop />}
      {view === 'orderSuccess' && <OrderSuccessPage />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AppProvider><App /></AppProvider>
);
</script>
</body>
</html>
